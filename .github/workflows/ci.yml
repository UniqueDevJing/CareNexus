name: CareNexus CI

on:
  push:
    branches: [main, 'refactor/**', 'codex/**']
  pull_request:
    branches: [main]

jobs:
  publication-copy:
    name: Public copy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject internal wording from public materials
        run: |
          if rg -n '根据.*课程|参考.*项目|比赛展示|ContestShowcase|NurseTriage|DEMO-001' README.md; then
            echo 'Public materials contain a forbidden internal wording token.'
            exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test hospital-v2
        working-directory: hospital-v2
        run: mvn -B test
      - name: Package hospital-v2
        working-directory: hospital-v2
        run: mvn -B package -DskipTests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-web-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hospital-web-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
