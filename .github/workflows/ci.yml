name: CareNexus CI

on:
  push:
    branches: [main, 'refactor/**', 'contest/**']
  pull_request:
    branches: [main]

jobs:
  publication-copy:
    name: Public copy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject internal wording from public materials
        run: |
          if rg -n '副本|参考|虚构|模拟|复制|假图|DEMO-001' README.md TIANCHI_SUBMISSION.md QUALITY_AUDIT_REPORT.md hospital-web-v2/src/views/contest; then
            echo 'Public materials contain a forbidden internal wording token.'
            exit 1
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test hospital-v2
        working-directory: hospital-v2
        run: mvn -B test
      - name: Package hospital-v2
        working-directory: hospital-v2
        run: mvn -B package -DskipTests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-web-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hospital-web-v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:contest
