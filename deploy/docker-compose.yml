services:
  mysql:
    image: mysql:8.0
    container_name: carenexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hospital_v2
      MYSQL_USER: ${MYSQL_USER:-carenexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - carenexus_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: carenexus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_USER: ${MYSQL_USER:-carenexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      # Must be set explicitly: use false for the bundled HTTP demo, true only behind HTTPS.
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:?Set AUTH_COOKIE_SECURE explicitly}"
      LLM_MODE: ${LLM_MODE:-real}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen-flash}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-v3}
    expose:
      - "18092"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: carenexus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  carenexus_mysql:
