# 生产 profile：--spring.profiles.active=mysql
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hospital_v2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

hospital:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    # Production profile must receive an explicit protocol decision from the environment.
    cookie-secure: ${AUTH_COOKIE_SECURE}
  llm:
    mode: ${LLM_MODE:real}
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # 生产启用 real 模式时必须显式注入阿里云百炼 Key，避免静默降级或空凭据启动。
    api-key: ${LLM_API_KEY}
    chat-model: ${LLM_CHAT_MODEL:qwen-flash}
    embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v3}
