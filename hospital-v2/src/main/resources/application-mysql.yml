# 生产 profile：--spring.profiles.active=mysql
spring:
  datasource:
    # Container deployments use the Compose service name; standalone deployments can override MYSQL_HOST.
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hospital_v2}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

hospital:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET}
    refresh-days: ${AUTH_REFRESH_DAYS:30}
    # Production profile must receive an explicit protocol decision from the environment.
    cookie-secure: ${AUTH_COOKIE_SECURE}
  crypto:
    # Prefer an independent Base64 AES key. The JWT fallback keeps existing
    # installations bootable until CARENEXUS_AES_KEY is provisioned separately.
    aes-key: ${CARENEXUS_AES_KEY:${AUTH_JWT_SECRET}}
  llm:
    mode: ${LLM_MODE:real}
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # 生产启用 real 模式时必须显式注入阿里云百炼 Key，避免静默降级或空凭据启动。
    api-key: ${LLM_API_KEY}
    chat-model: ${LLM_CHAT_MODEL:qwen-flash}
    embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v3}
  schedule:
    # 演示服务器若数据库中排班已全部过期，自动按现有医生补齐未来可预约号源。
    # 接入真实医院排班系统时设置 HOSPITAL_SEED_DEMO_SCHEDULES=false。
    seed-demo: ${HOSPITAL_SEED_DEMO_SCHEDULES:false}
  # 空数据库默认拒绝启动，避免把公开演示账号和固定排班带入生产。
  # 仅在隔离演示环境显式设置 HOSPITAL_SEED_DEMO_DATA=true。
  seed-demo-data: ${HOSPITAL_SEED_DEMO_DATA:false}
